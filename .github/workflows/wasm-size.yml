name: WASM Size Guard

on:
  push:
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - '.github/**'
  pull_request:
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - '.github/**'

jobs:
  build-and-check:
    name: Build optimized WASM and check size
    runs-on: ubuntu-latest
    env:
      # Default Soroban max size in bytes; update if Soroban changes this limit
      SOROBAN_MAX_WASM_BYTES: 200000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (with wasm targets)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.91.1
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: bash scripts/ci/install_stellar_cli.sh

      - name: Build optimized WASM (release)
        # soroban-sdk v28 requires the Stellar CLI build system: it applies
        # spec shaking, so plain `cargo build` cannot produce the contract.
        run: |
          stellar contract build --locked

      - name: Run WASM size check
        run: |
          chmod +x scripts/ci/check_wasm_size.sh
          scripts/ci/check_wasm_size.sh

      - name: Upload wasm artifacts (for inspection)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-files
          path: target/wasm32v1-none/release/*.wasm
