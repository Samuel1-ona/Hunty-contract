name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly dependency advisory refresh
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security:
    name: Automated Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-security-

      - name: Prepare report workspace
        run: |
          mkdir -p security-reports
          echo "# Security Scan Report" > security-reports/summary.md
          echo "" >> security-reports/summary.md
          echo "_Generated by CI for \`${{ github.sha }}\`_" >> security-reports/summary.md
          echo "" >> security-reports/summary.md

      - name: Install scanning tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,wasm-tools

      # ------------------------------------------------------------------
      # 1) Dependency vulnerabilities (cargo-audit)
      # ------------------------------------------------------------------
      - name: Run cargo-audit
        id: cargo_audit
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Dependency Audit (\`cargo-audit\`)"
            echo ""
          } >> security-reports/summary.md

          if cargo audit 2>&1 | tee security-reports/cargo-audit.txt; then
            echo "✅ No known vulnerabilities." >> security-reports/summary.md
            echo "audit_status=pass" >> "$GITHUB_OUTPUT"
          else
            {
              echo "❌ Vulnerabilities found."
              echo ""
              echo '<details><summary>cargo-audit output</summary>'
              echo ""
              echo '```'
              cat security-reports/cargo-audit.txt
              echo '```'
              echo "</details>"
            } >> security-reports/summary.md
            echo "audit_status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 2) Clippy security-focused static analysis
      # ------------------------------------------------------------------
      - name: Run Clippy security lints
        id: clippy_security
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo ""
            echo "## Static Analysis (Clippy security lints)"
            echo ""
          } >> security-reports/summary.md

          # Enable security-oriented Clippy lints as warnings so findings are
          # always reported in the PR comment without blocking on existing debt.
          CLIPPY_FLAGS=(
            -W clippy::correctness
            -W clippy::suspicious
            -W clippy::unwrap_used
            -W clippy::expect_used
            -W clippy::panic
            -W clippy::todo
            -W clippy::unimplemented
            -W clippy::indexing_slicing
            -W clippy::arithmetic_side_effects
            -W clippy::as_conversions
            -W clippy::cast_possible_truncation
            -W clippy::cast_sign_loss
            -W clippy::cast_possible_wrap
            -W clippy::mem_forget
            -W clippy::lossy_float_literal
            -W clippy::undocumented_unsafe_blocks
          )

          set +e
          cargo clippy --workspace --all-targets --message-format=short -- \
            "${CLIPPY_FLAGS[@]}" \
            2>&1 | tee security-reports/clippy-security.txt
          clippy_exit=${PIPESTATUS[0]}
          set -e

          warning_count=$(grep -cE 'warning:' security-reports/clippy-security.txt || true)
          error_count=$(grep -cE '^error' security-reports/clippy-security.txt || true)

          {
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| Warnings | ${warning_count} |"
            echo "| Errors | ${error_count} |"
            echo ""
            if [ "$warning_count" -gt 0 ] || [ "$error_count" -gt 0 ]; then
              echo "Security-relevant Clippy findings were detected (see details)."
            else
              echo "✅ No Clippy security diagnostics reported."
            fi
            echo ""
            echo '<details><summary>Clippy security output</summary>'
            echo ""
            echo '```'
            # Keep PR comments bounded
            tail -n 200 security-reports/clippy-security.txt
            echo '```'
            echo "</details>"
          } >> security-reports/summary.md

          # Report-oriented: only fail if Clippy cannot analyze the workspace.
          if [ "$clippy_exit" -eq 0 ] || [ "$error_count" -eq 0 ]; then
            echo "clippy_status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "" >> security-reports/summary.md
            echo "❌ Clippy could not complete analysis (build/errors)." >> security-reports/summary.md
            echo "clippy_status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 3) WASM binary analysis
      # ------------------------------------------------------------------
      - name: Build release WASM contracts
        id: wasm_build
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --workspace --target wasm32-unknown-unknown --release 2>&1 | tee security-reports/wasm-build.txt

      - name: Analyze WASM binaries
        id: wasm_analysis
        if: steps.wasm_build.outcome == 'success'
        continue-on-error: true
        env:
          SECURITY_WASM_REPORT: security-reports/wasm-analysis.md
        run: |
          chmod +x scripts/ci/analyze_wasm_security.sh
          set +e
          scripts/ci/analyze_wasm_security.sh
          wasm_exit=$?
          set -e
          {
            echo ""
            cat security-reports/wasm-analysis.md
          } >> security-reports/summary.md
          if [ "$wasm_exit" -eq 0 ]; then
            echo "wasm_status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "wasm_status=fail" >> "$GITHUB_OUTPUT"
            exit "$wasm_exit"
          fi

      - name: Record WASM build failure
        if: steps.wasm_build.outcome != 'success'
        run: |
          {
            echo ""
            echo "## WASM Binary Analysis"
            echo ""
            echo "❌ Release WASM build failed; binary analysis skipped."
            echo ""
            echo '<details><summary>Build output</summary>'
            echo ""
            echo '```'
            tail -n 100 security-reports/wasm-build.txt
            echo '```'
            echo "</details>"
          } >> security-reports/summary.md
          echo "wasm_status=fail" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 4) Report findings in PR comments
      # ------------------------------------------------------------------
      - name: Upload security report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: security-reports/
          if-no-files-found: ignore

      - name: Comment security findings on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: hunty-security-scan
          path: security-reports/summary.md
          recreate: true
          ignore_empty: true

      - name: Fail job if any security gate failed
        if: always()
        run: |
          failed=0
          if [ "${{ steps.cargo_audit.outcome }}" != "success" ]; then
            echo "cargo-audit failed (outcome=${{ steps.cargo_audit.outcome }})"
            failed=1
          fi
          if [ "${{ steps.clippy_security.outcome }}" != "success" ]; then
            echo "clippy security lints failed (outcome=${{ steps.clippy_security.outcome }})"
            failed=1
          fi
          # WASM analysis may be skipped only when the build step itself failed.
          if [ "${{ steps.wasm_build.outcome }}" != "success" ]; then
            echo "WASM build failed (outcome=${{ steps.wasm_build.outcome }})"
            failed=1
          elif [ "${{ steps.wasm_analysis.outcome }}" != "success" ]; then
            echo "WASM analysis failed (outcome=${{ steps.wasm_analysis.outcome }})"
            failed=1
          fi
          exit "$failed"
