name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly dependency advisory refresh
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security:
    name: Automated Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-security-

      - name: Prepare report workspace
        run: |
          mkdir -p security-reports
          echo "# Security Scan Report" > security-reports/summary.md
          echo "" >> security-reports/summary.md
          echo "_Generated by CI for \`${{ github.sha }}\`_" >> security-reports/summary.md
          echo "" >> security-reports/summary.md

      - name: Install scanning tools
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit,wasm-tools

      # ------------------------------------------------------------------
      # 1) Dependency vulnerabilities (cargo-audit) — hard gate
      # ------------------------------------------------------------------
      - name: Run cargo-audit
        id: cargo_audit
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "## Dependency Audit (\`cargo-audit\`)"
            echo ""
          } >> security-reports/summary.md

          if cargo audit 2>&1 | tee security-reports/cargo-audit.txt; then
            echo "✅ No known vulnerabilities." >> security-reports/summary.md
            echo "audit_status=pass" >> "$GITHUB_OUTPUT"
          else
            {
              echo "❌ Vulnerabilities found."
              echo ""
              echo '<details><summary>cargo-audit output</summary>'
              echo ""
              echo '```'
              cat security-reports/cargo-audit.txt
              echo '```'
              echo "</details>"
            } >> security-reports/summary.md
            echo "audit_status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 2) Clippy security-focused static analysis — report findings
      # ------------------------------------------------------------------
      - name: Run Clippy security lints
        id: clippy_security
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo ""
            echo "## Static Analysis (Clippy security lints)"
            echo ""
          } >> security-reports/summary.md

          # Security-oriented Clippy lints (warnings). Analyze library targets
          # only so broken/incomplete tests do not block the security report.
          CLIPPY_FLAGS=(
            -W clippy::correctness
            -W clippy::suspicious
            -W clippy::unwrap_used
            -W clippy::expect_used
            -W clippy::panic
            -W clippy::todo
            -W clippy::unimplemented
            -W clippy::indexing_slicing
            -W clippy::arithmetic_side_effects
            -W clippy::as_conversions
            -W clippy::cast_possible_truncation
            -W clippy::cast_sign_loss
            -W clippy::cast_possible_wrap
            -W clippy::mem_forget
            -W clippy::lossy_float_literal
            -W clippy::undocumented_unsafe_blocks
          )

          set +e
          cargo clippy --workspace --lib --message-format=short -- \
            "${CLIPPY_FLAGS[@]}" \
            2>&1 | tee security-reports/clippy-security.txt
          clippy_exit=${PIPESTATUS[0]}
          set -e

          warning_count=$(grep -cE 'warning:' security-reports/clippy-security.txt || true)
          error_count=$(grep -cEi 'error(\[|:)|could not compile' security-reports/clippy-security.txt || true)

          {
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| Warnings | ${warning_count} |"
            echo "| Errors | ${error_count} |"
            echo "| Exit code | ${clippy_exit} |"
            echo ""
            if [ "$warning_count" -gt 0 ] || [ "$error_count" -gt 0 ]; then
              echo "Security-relevant Clippy findings / diagnostics were detected (see details)."
            else
              echo "✅ No Clippy security diagnostics reported."
            fi
            echo ""
            echo '<details><summary>Clippy security output</summary>'
            echo ""
            echo '```'
            tail -n 200 security-reports/clippy-security.txt
            echo '```'
            echo "</details>"
          } >> security-reports/summary.md

          # Scan always "passes" once findings are captured; compile breakage in
          # the wider repo is reported above but is not a security-gate failure.
          echo "clippy_status=pass" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3) WASM binary analysis — best-effort per contract package
      # ------------------------------------------------------------------
      - name: Build release WASM contracts
        id: wasm_build
        continue-on-error: true
        run: |
          set +e
          {
            echo "Building workspace members individually for WASM analysis..."
            for pkg in hunty-core nft-reward reward-manager; do
              echo "=== cargo build -p ${pkg} --target wasm32-unknown-unknown --release ==="
              cargo build -p "$pkg" --target wasm32-unknown-unknown --release
            done
          } 2>&1 | tee security-reports/wasm-build.txt
          set -e

          shopt -s nullglob
          wasm_files=(target/wasm32-unknown-unknown/release/*.wasm)
          echo "Built ${#wasm_files[@]} wasm artifact(s)" | tee -a security-reports/wasm-build.txt
          # Succeed the step if at least one contract WASM was produced.
          if [ ${#wasm_files[@]} -gt 0 ]; then
            exit 0
          fi
          exit 1

      - name: Analyze WASM binaries
        id: wasm_analysis
        if: always()
        continue-on-error: true
        env:
          SECURITY_WASM_REPORT: security-reports/wasm-analysis.md
        run: |
          chmod +x scripts/ci/analyze_wasm_security.sh
          set +e
          scripts/ci/analyze_wasm_security.sh
          wasm_exit=$?
          set -e

          if [ -f security-reports/wasm-analysis.md ]; then
            {
              echo ""
              cat security-reports/wasm-analysis.md
            } >> security-reports/summary.md
          else
            {
              echo ""
              echo "## WASM Binary Analysis"
              echo ""
              echo "❌ No WASM analysis report was produced."
              echo ""
              echo '<details><summary>Build output</summary>'
              echo ""
              echo '```'
              tail -n 100 security-reports/wasm-build.txt 2>/dev/null || echo "(no build log)"
              echo '```'
              echo "</details>"
            } >> security-reports/summary.md
          fi

          # Report-oriented: capture findings even when some packages failed to build.
          echo "wasm_status=pass" >> "$GITHUB_OUTPUT"
          exit 0

      # ------------------------------------------------------------------
      # 4) Report findings (job summary + PR comment when permitted)
      # ------------------------------------------------------------------
      - name: Upload security report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-report
          path: security-reports/
          if-no-files-found: ignore

      - name: Write security findings to job summary
        if: always()
        run: |
          if [ -f security-reports/summary.md ]; then
            cat security-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Security report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment security findings on PR
        # Fork PRs often lack pull-requests:write; do not fail the scan for that.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: hunty-security-scan
          path: security-reports/summary.md
          recreate: true
          ignore_empty: true

      - name: Fail job if security audit gate failed
        if: always()
        run: |
          # Hard gate: known dependency vulnerabilities from cargo-audit.
          # Clippy + WASM are report-oriented so pre-existing compile issues on
          # main do not block the security scanning integration.
          if [ "${{ steps.cargo_audit.outcome }}" != "success" ]; then
            echo "cargo-audit failed (outcome=${{ steps.cargo_audit.outcome }})"
            exit 1
          fi
          echo "Security audit gate passed."
          exit 0
