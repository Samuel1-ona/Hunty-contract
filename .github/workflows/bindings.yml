name: Generate Contract Bindings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Generate TypeScript bindings
        run: make bindings

      - name: Check for uncommitted changes in bindings
        run: git diff --exit-code bindings

      - name: Upload bindings artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-bindings
          path: bindings/
