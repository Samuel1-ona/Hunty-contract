name: Generate Contract Bindings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo +1.91.0 install --locked stellar-cli --version 25.2.0

      - name: Build contracts
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Generate TypeScript bindings
        run: make bindings

      - name: Check for uncommitted changes in bindings
        run: git diff --exit-code bindings

      - name: Upload bindings artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-bindings
          path: bindings/
