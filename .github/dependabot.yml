version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bindings/hunty-core"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bindings/nft-reward"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bindings/reward-manager"
    schedule:
      interval: "weekly"
